# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # The build is warning-clean, so keep it that way: a broken cross-reference
  # or an unindexed page fails the build rather than quietly rotting.
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
  - epub
