name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/bluesky_sandbox/ui/designer/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The frontend is not committed, so it must be built before the package
      # is installed. FORCE_NPM turns a missing npm into an error rather than a
      # silent fallback to an output that does not exist here.
      - name: Install (builds the designer frontend)
        env:
          BLUESKY_SANDBOX_FORCE_NPM: "1"
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # Mirrors the Read the Docs build: docs/requirements.txt only. No Node
      # and no package install - conf.py puts src/ on sys.path, so a docs build
      # never compiles the designer frontend.
      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt
      # `strict` is sphinx-build -W --keep-going, defined once in docs/Makefile
      # so CI and a local build cannot drift apart.
      - name: Build docs (warnings are errors)
        run: make -C docs strict
